<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kkblank - 个人主页</title>
  <meta name="description" content="kkblank 的个人网站，分享技术笔记与项目实践" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <!-- 导航栏占位符，将由 JS 填充 -->
  <div id="navbar"></div>

  <main class="container">
    <section class="hero card">
      <img src="/assets/images/avatar.png" alt="avatar" class="hero-avatar" onerror="this.style.display='none'" />
      <h1>kkblank</h1>
      <p class="tagline">热爱技术 &middot; 持续学习 &middot; 乐于分享</p>
      <div class="tags">
        <span class="tag">Python</span>
        <span class="tag">Linux</span>
        <span class="tag">Docker</span>
        <span class="tag">AI图像识别</span>
        <span class="tag">NLP</span>
        <span class="tag">CV工程师</span>
      </div>
    </section>

    <section>
      <h2 class="section-title"><i class="fa-solid fa-book"></i> 最新笔记</h2>
      <div class="card">
        <ul class="entry-list">
          <li class="entry-item">
            <a href="#" class="entry-title">暂未发布笔记</a>
            <span class="entry-date">--</span>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <!-- 页脚占位符，将由 JS 填充 -->
  <div id="footer"></div>
  
  <!-- 脚本 -->
  <script src="/assets/js/components.js"></script>
</body>
</html>
